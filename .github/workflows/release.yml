name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/MyShortcutGuide/MyShortcutGuide.csproj -c Release
      - name: Test
        run: dotnet run --project tests/MyShortcutGuide.Tests -c Release
      - name: Publish
        shell: pwsh
        run: |
          $version = '0.1.6'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./scripts/publish.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: MyShortcutGuide-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyShortcutGuide-win-x64
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --draft --generate-notes --verify-tag
